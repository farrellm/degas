[project]
name = "degas-server"
version = "0.1.0"
description = "Degas home server: API, job queue, Colab session manager"
requires-python = ">=3.13,<3.14"
dependencies = [
    "degas-worker",  # the worker bundle is built from the installed package
    "fastapi>=0.141",
    "httpx2>=2.13",
    "pillow>=12",
    "pillow-heif>=1",
    "pywebpush>=2.5.0",
    "pyyaml>=6",
    "uvicorn[standard]>=0.54",
]

[tool.uv.sources]
degas-worker = { workspace = true }

[project.scripts]
degas = "degas.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "degas"
